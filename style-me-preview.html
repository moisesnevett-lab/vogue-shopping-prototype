<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Vogue">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./public/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./public/style-me.css">
    <script src="./public/style-me.js" defer></script>
    <title>Vogue — Style Me</title>
  </head>
  <body>
    <header class="style-header">
      <img id="style-header-image" alt="Vogue Shopping" width="1875" height="500">
      <a class="hotspot logo-home" href="./today-image-preview.html" aria-label="Return to Links Menu"></a>
    </header>
    <main id="style-content" aria-label="Style Me"></main>
    <nav class="style-dock" aria-label="Main navigation">
      <img id="style-dock-image" alt="" width="1875" height="415">
      <a class="hotspot dock-target" href="./today-image-preview.html?view=collapsed" aria-label="Today"></a>
      <button class="hotspot dock-target" type="button" aria-label="Collection"></button>
      <button class="hotspot dock-target" id="shopping-top" type="button" aria-label="Shopping" aria-current="page"></button>
      <button class="hotspot dock-target" type="button" aria-label="Discover"></button>
    </nav>
    <noscript>Please enable JavaScript to view the Style Me prototype.</noscript>
  </body>
</html>
