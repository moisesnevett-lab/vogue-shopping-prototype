<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Vogue">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./public/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./public/style-me.css">
    <link rel="stylesheet" href="./public/style-me-v3.css">
    <script src="./public/style-me-v3.js" defer></script>
    <title>Vogue — Style Me 3.0</title>
  </head>
  <body class="style-v3">
    <header class="style-header" id="v3-header">
      <div class="v3-masthead">
        <img src="./Style%20Me%203.0/STYLE%20ME%203.0/v3__sticky_vogue_header.png" alt="Vogue Shopping" width="1875" height="500">
        <a class="hotspot logo-home" href="./today-image-preview.html" aria-label="Return to Links Menu"></a>
      </div>
      <nav class="category-nav" id="v3-categories" aria-label="Shopping categories">
        <img src="./Style%20Me%203.0/STYLE%20ME%203.0/v3__sticky_category_nav.png" alt="" width="1875" height="230">
      </nav>
    </header>
    <main id="style-content" aria-label="Style Me 3.0"></main>
    <nav class="style-dock" id="v3-dock" aria-label="Main navigation">
      <img src="./Style%20Me%203.0/STYLE%20ME%203.0/v3__fixed_bottom_navigation.png" alt="" width="1875" height="415">
      <a class="hotspot dock-target" href="./today-image-preview.html?view=collapsed" aria-label="Today"></a>
      <button class="hotspot dock-target" type="button" aria-label="Collection"></button>
      <button class="hotspot dock-target" id="shopping-top" type="button" aria-label="Shopping" aria-current="page"></button>
      <button class="hotspot dock-target" type="button" aria-label="Discover"></button>
    </nav>
    <div class="v3-plp-backdrop" id="plp-backdrop" hidden></div>
    <section class="v3-plp-overlay" id="plp-overlay" role="dialog" aria-modal="true" aria-label="Shopping product list" tabindex="-1" hidden>
      <div class="v3-plp-sheet" id="plp-sheet">
        <header class="v3-plp-header" id="plp-header">
          <img src="./Style%20Me%203.0/STYLE%20ME%203.0/v3__PLP_sticky_back_header.png" alt="" width="1875" height="315">
          <button class="hotspot v3-back" id="plp-back" type="button" aria-label="Back to Style Me 3.0"></button>
        </header>
        <div id="plp-content"></div>
      </div>
      <div class="v3-dismiss-runway" aria-hidden="true"></div>
    </section>
    <noscript>Please enable JavaScript to view Style Me 3.0.</noscript>
  </body>
</html>
